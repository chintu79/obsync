name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  # ------------------------------------------------------- httpd server binaries
  server-binaries:
    name: Server binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: obsync-server-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: obsync-server-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: obsync-server-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: obsync-server-windows-x86_64.exe
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release -p obsync-httpd --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          cp target/${{ matrix.target }}/release/obsync-httpd$EXT \
             obsync-server-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsync-server-${{ matrix.target }}
          path: obsync-server-${{ matrix.target }}

  # ------------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [server-binaries]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Obsync ${{ github.ref_name }}
          body: |
            ## Obsync ${{ github.ref_name }}

            > **New:** Obsync is now an Obsidian plugin — install it from the
            > community catalog to sync desktop ⇄ mobile without separate apps.
            > See [chintu79/obsync-plugin](https://github.com/chintu79/obsync-plugin).

            ### Desktop server (headless / self-hosted / NAS)
            Download the binary for your OS, then run it — it opens the pairing
            dashboard at http://localhost:42021 automatically:
            - Linux: `obsync-server-linux-x86_64` (or `./run-server.sh` from source)
            - macOS: `obsync-server-macos-aarch64` / `obsync-server-macos-x86_64`
            - Windows: `obsync-server-windows-x86_64.exe`
          files: |
            artifacts/obsync-server-*
          generate_release_notes: true
